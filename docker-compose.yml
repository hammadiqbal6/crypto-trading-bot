services:
  dashboard:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TRADING_MODE=demo
      - LIVE_TRADING=false
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
    volumes:
      - ./user_data:/app/user_data
      - ./config:/app/config
    restart: unless-stopped

  # Optional: run freqtrade trade loop (demo/dry-run)
  freqtrade:
    build: .
    profiles: ["trade"]
    env_file:
      - .env
    command: ["freqtrade-trade"]
    volumes:
      - ./user_data:/app/user_data
      - ./config:/app/config
    restart: unless-stopped
