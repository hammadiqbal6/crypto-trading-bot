[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Production-quality open-source AI crypto trading bot (freqtrade + sentiment + validation)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Sidney" }]
keywords = ["crypto", "trading", "freqtrade", "sentiment", "freqai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "ccxt>=4.4.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "tenacity>=9.0.0",
  "diskcache>=5.6.3",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.14.0",
  "ta>=0.11.0",
  "structlog>=24.4.0",
  "rich>=13.9.0",
  "typer>=0.12.0",
  "orjson>=3.10.0",
  "python-dotenv>=1.0.1",
  "aiosqlite>=0.20.0",
  "sqlalchemy>=2.0.36",
  "prometheus-client>=0.21.0",
  "pyyaml>=6.0.2",
  "joblib>=1.4.0",
]

[project.optional-dependencies]
# Freqtrade is the trading engine (GPL-3.0) — install via: pip install -e ".[engine]"
engine = ["freqtrade>=2024.12"]
# Local FinBERT sentiment (CPU). LLM providers work without this.
finbert = ["transformers>=4.45.0", "torch>=2.4.0"]
# Optional vectorbt sweeps (walk-forward also works without it)
vectorbt = ["vectorbt>=0.26.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-httpx>=0.34.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "types-PyYAML>=6.0.12",
  "httpx>=0.27.0",
  "playwright>=1.48.0",
]
llm-groq = ["groq>=0.11.0"]
llm-openai = ["openai>=1.54.0"]
carry = ["pybit>=5.8.0"]
all = [
  "crypto-trading-bot[engine,finbert,vectorbt,llm-groq,carry]",
]

[project.scripts]
crypto-bot = "crypto_bot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_bot"]

[tool.hatch.build.targets.sdist]
include = ["src/crypto_bot", "config", "docs", "user_data/strategies"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]
"user_data/strategies/**" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["crypto_bot"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["freqtrade.*", "vectorbt.*", "ta.*", "transformers.*", "torch.*", "diskcache.*", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=crypto_bot --cov-report=term-missing --cov-fail-under=55"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
markers = [
  "e2e: Playwright end-to-end UI tests (excluded from default unit/integration runs)",
]

[tool.coverage.run]
source = ["src/crypto_bot"]
omit = ["src/crypto_bot/dashboard/*", "src/crypto_bot/cli.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
